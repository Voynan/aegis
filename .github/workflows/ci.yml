# Every pull request and every push to main (docs/stack.md § 7, docs/tests.md § 9).
# `ci-ok` aggregates every job; it is the one check the main ruleset requires.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A superseded PR run is cancelled; every push to main runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.11" # mypy checks against the floor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.2"
      - run: uv python install "$UV_PYTHON"
      - run: uv sync --locked --all-extras
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: zizmor, online, over workflows, Dependabot and pre-commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run zizmor --format=github .

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python }}
      CELL: ${{ matrix.os }}-${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.2"
      - run: uv python install "$UV_PYTHON"
      - run: uv sync --locked --all-extras
      - run: uv run pytest --cov --cov-branch --cov-report=
      - name: Name this cell's coverage data
        run: mv .coverage ".coverage.$CELL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: .coverage.*
          include-hidden-files: true # the data files are dotfiles
          if-no-files-found: error
          retention-days: 1

  floor:
    name: Floor (lowest-direct, Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.2"
      - run: uv python install "$UV_PYTHON"
      # Not the lock: uv locks every group together, so a dev tool's requirement could
      # raise a runtime floor there. uv pip resolves only the published requirements and the
      # tools the suite runs (ADR-0040).
      - run: uv venv
      - run: uv pip install --resolution lowest-direct -e ".[cli]" --group test
      - name: The floors, not the lock
        run: |
          uv run --no-sync python -c "import importlib.metadata as m; print('cryptography', m.version('cryptography')); print('click', m.version('click'))"
      - run: uv run --no-sync pytest

  coverage:
    name: Coverage gates
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.2"
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: uv run coverage combine
      - run: uv run coverage report
      - run: uv run coverage json
      - run: uv run python tools/coverage_gates.py

  vectors-guard:
    name: Frozen vectors are never changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Only additions under tests/vectors/
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Lowercase `a` is every status except added; without rename detection a rename
          # is a deletion, so it fails too (M0 spec, D6).
          changed=$(git diff --no-renames --name-status --diff-filter=a "$BASE" HEAD -- tests/vectors/)
          if [ -n "$changed" ]; then
            printf '::error::tests/vectors/ is frozen; only additions are allowed:\n%s\n' "$changed"
            exit 1
          fi
          echo "tests/vectors/: no modification, deletion or rename"

  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, test, floor, coverage, vectors-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          [ -n "$RESULTS" ] || { echo "::error::no job results"; exit 1; }
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job ended as '$result'"
              exit 1
            fi
          done
