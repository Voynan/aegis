# Local hooks only: each runs the tool locked in uv.lock, so a commit is checked by the same
# versions CI runs (stack.md § 6.2). mypy runs in CI, not here, to keep commits fast.
minimum_pre_commit_version: "4.4.0"

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: unsupported
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
