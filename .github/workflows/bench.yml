# The benchmark suite on the reference runners (docs/performance.md § 5). Never a PR gate.
# Until benchmarks/ holds a .py file, every run logs that and skips.

name: Bench

on:
  schedule:
    - cron: "23 5 * * 1"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench # one benchmark run at a time
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  bench:
    name: Bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: hashFiles('benchmarks/**/*.py') == ''
        run: echo "no benchmarks yet"
      - if: hashFiles('benchmarks/**/*.py') != ''
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.2"
          enable-cache: false # runs on release tags
      - if: hashFiles('benchmarks/**/*.py') != ''
        run: uv sync --locked --all-extras
      - if: hashFiles('benchmarks/**/*.py') != ''
        run: uv run pytest benchmarks --benchmark-only --benchmark-json=bench.json
      - if: hashFiles('benchmarks/**/*.py') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.os }}
          path: bench.json
          if-no-files-found: error
